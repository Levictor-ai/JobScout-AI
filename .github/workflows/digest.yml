name: Hourly job digest

# The schedule lives here rather than in vercel.json because the Hobby plan allows at most two
# cron jobs, each no more frequent than daily (see README), and the digest needs to run hourly.
# Vercel Cron would also send `Authorization: Bearer $CRON_SECRET` by itself, which would remove
# the hand-copied secret that sent the previous version eight runs deep on a 401.
#
# Known limitation: GitHub queues scheduled workflows badly on public repos. This asks for :17
# every hour and the runs arrive 6-7 hours apart. Nothing is lost, because the route dedupes, so
# a new posting is reported late rather than never.
#
# `workflow_dispatch` is the manual escape hatch: Actions > Hourly job digest > Run workflow.
on:
  schedule:
    # Off the hour on purpose: every repo's cron fires at :00 and GitHub queues them.
    - cron: '17 * * * *'
  workflow_dispatch:

# This job only calls an external URL, so it needs no repository access. Grant none.
permissions: {}

# Never let two digests overlap, or the same posting can be sent twice before either run has
# recorded it.
concurrency:
  group: hourly-job-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Send new job matches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger digest
        env:
          DIGEST_URL: ${{ vars.DIGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # `:-` on both. `set -u` aborts on an unset variable, so a bare `${CRON_SECRET}` would
          # kill the script with "unbound variable" before the `-z` test below could report it.
          # GitHub substitutes an empty string for a missing secret today, but depending on that
          # turns a clear message into an unbound-variable trace.
          url="${DIGEST_URL:-https://job-scout-ai-rho.vercel.app/api/cron/digest}"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # The route caps itself at 300s (maxDuration), so cap curl just past that: a slow
          # request then fails here with curl's own error rather than sitting until the job is
          # killed at 10 minutes with no output. The `|| status=000` keeps a connection-level
          # failure (DNS, TLS, timeout) from tripping `set -e` before the report below.
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 330 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${url}") || status="000"

          echo "HTTP ${status}"
          echo '--- response ---'
          cat response.json 2>/dev/null || echo '(no response body)'
          echo

          if [ "${status}" != "200" ]; then
            echo "Digest run failed with HTTP ${status}."

            # A 401 is the failure that is hardest to read, because both sides look configured:
            # the secret is set, so the guard above passes, and the route is healthy, so the
            # deployment looks fine. It almost always means the two sides hold different values.
            if [ "${status}" = "401" ]; then
              echo "401 means this CRON_SECRET does not match CRON_SECRET on the Vercel deployment."
              echo "Both must hold the same value. Copy one from the other, don't generate a new one."
            fi

            exit 1
          fi
